<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Расписание — управление</title><style>body{font:16px/1.5 Arial,sans-serif;color:#24382f;background:#f7f5ef;max-width:850px;margin:40px auto;padding:0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #bbc5b7;border-radius:5px}button{cursor:pointer;background:#e7ecdf}label{display:block;margin:15px 0}input[type=password]{width:min(360px,90%)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.day{background:#fffdf8;padding:15px;border:1px solid #dcded3;margin:10px 0}.slot{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}#status{min-height:30px}fieldset{border:0;padding:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a84332;outline-offset:2px}[hidden]{display:none!important}</style></head><body><h1>Расписание Марии</h1><p>Отмечайте свободные и занятые часы. Изменения появятся на сайте после сохранения.</p><form id="login"><label>Ключ доступа <input id="key" type="password" autocomplete="off" required></label><button>Открыть расписание</button></form><div id="editor" hidden><div class="toolbar"><button id="logout">Выйти</button><label>Часовой пояс <select id="zone"><option value="Etc/UTC">UTC — выберите нужный пояс</option><option value="Europe/Moscow">Москва (UTC+3)</option><option value="Asia/Irkutsk">Иркутск (UTC+8)</option><option value="Asia/Yekaterinburg">Екатеринбург (UTC+5)</option><option value="Asia/Novosibirsk">Новосибирск (UTC+7)</option><option value="Europe/Tallinn">Таллин</option></select></label></div><label hidden><input type="checkbox" id="repeat"> Повторять базовое расписание каждую неделю</label><label hidden>Что редактируем? <select id="mode"><option value="week">Конкретную неделю</option><option value="template">Базовое расписание</option></select></label><label id="weekLabel">Неделя с понедельника <input type="date" id="week" required></label><div class="toolbar"><button id="copy">Взять часы предыдущей недели</button><button id="inherit">Очистить эту неделю</button></div><p id="source"></p><fieldset id="days"></fieldset><button id="save">Сохранить расписание</button><p>Заявки не закрывают часы автоматически. Подтвердив время ученику, отметьте его как занятое и сохраните.</p></div><p id="status" role="status" aria-live="polite"></p><script type="module" src="admin.js"></script></body></html>
