<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Мария / English</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="landing.css">
  <link rel="stylesheet" href="header.css?v=accounts">
  <link rel="stylesheet" href="account.css">
  <script src="account.js?v=recovery" defer></script>
</head>
<body>
  <header class="site-header account-header"><div class="wrap">
    <a class="logo" href="index.html">Мария <span>/ English</span></a>
    <a class="text-link" href="index.html">На главную</a>
  </div></header>
  <main class="account-main">
    <div class="wrap account-wrap">
      <span class="eyebrow">Мария / English</span>
      <h1 id="authTitle">Вход в аккаунт</h1>
      <form id="authForm" method="post">
        <div id="registerName" hidden>
          <label for="authName">Имя</label>
          <input id="authName" name="name" autocomplete="given-name" maxlength="80" disabled>
        </div>
        <div>
          <label for="authEmail">Email</label>
          <input id="authEmail" name="email" type="email" autocomplete="username" maxlength="254" autocapitalize="none" required>
        </div>
        <div>
          <label for="authPassword">Пароль</label>
          <input id="authPassword" name="password" type="password" autocomplete="current-password" maxlength="128" required>
          <p id="passwordHint" class="form-note" hidden>От 12 до 128 символов.</p>
        </div>
        <button class="btn" type="submit" disabled>Войти</button>
        <p class="status form-note" id="authStatus" role="status">Для входа откройте сайт через сервер.</p>
      </form>
      <div class="account-actions">
        <span id="authAlternative"><a class="text-link" href="auth.html?mode=register">Зарегистрироваться</a></span>
        <a class="text-link" id="forgotPassword" href="recovery.html" hidden>Забыли пароль?</a>
      </div>
      <p><a class="text-link" href="teacher.html">Вход для преподавателя</a></p>
    </div>
  </main>
</body>
</html>
