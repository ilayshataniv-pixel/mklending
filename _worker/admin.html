<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Расписание — управление</title><link rel="stylesheet" href="admin.css"></head><body><nav><a href="teacher.html">Кабинет Марии</a> · <a href="index.html">На сайт</a></nav><h1>Расписание Марии</h1><p>Отмечайте свободные и занятые часы. Изменения появятся на сайте после сохранения.</p><form id="login"><label>Ключ доступа <input id="key" type="password" autocomplete="off" required></label><button>Открыть расписание</button></form><div id="editor" hidden><div class="toolbar"><button id="logout">Выйти</button><label>Часовой пояс <select id="zone"><option value="Etc/UTC">UTC — выберите нужный пояс</option><option value="Europe/Moscow">Москва (UTC+3)</option><option value="Asia/Irkutsk">Иркутск (UTC+8)</option><option value="Asia/Yekaterinburg">Екатеринбург (UTC+5)</option><option value="Asia/Novosibirsk">Новосибирск (UTC+7)</option><option value="Europe/Tallinn">Таллин</option></select></label></div><label hidden><input type="checkbox" id="repeat"> Повторять базовое расписание каждую неделю</label><label hidden>Что редактируем? <select id="mode"><option value="week">Конкретную неделю</option><option value="template">Базовое расписание</option></select></label><label id="weekLabel">Неделя (выберите любую дату) <input type="date" id="week" required></label><div class="toolbar"><button id="copy">Взять часы предыдущей недели</button><button id="inherit">Очистить эту неделю</button></div><p id="source"></p><fieldset id="days"></fieldset><button id="save">Сохранить расписание</button><p>Заявки временно закрывают выбранные часы. Подтверждённые занятия также показываются занятыми на сайте. Другую занятость отмечайте вручную.</p></div><p id="status" role="status" aria-live="polite"></p><script type="module" src="admin.js?v=teacher-session"></script></body></html>
